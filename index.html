<title>Murmur Transcribe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: studio console. Folder rail on the left, file ledger in the middle; a transcript reads like a timecoded script with tools docked right and a tape transport pinned to the bottom. */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface-2:#E9EDF1; --ink:#141920; --muted:#5A6371; --line:#D8DDE4;
  --accent:#0B6B66; --accent-ink:#FFFFFF; --accent-soft:#DCEFEC;
  --signal:#B85F00; --signal-soft:#FCEED9;
  --good:#18744A; --good-soft:#DDF1E5; --bad:#B42318; --bad-soft:#FBE4E1;
  --hl:#FFEFA8; --hl-ink:#141920; --scrim:rgba(14,18,24,.42);
  --shadow:0 1px 2px rgba(16,22,30,.06),0 10px 28px rgba(16,22,30,.09);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1115; --surface:#151A20; --surface-2:#1C222A; --ink:#E6EAEE; --muted:#97A0AC; --line:#29303A;
  --accent:#45C4B9; --accent-ink:#06211F; --accent-soft:#163331;
  --signal:#F2A23C; --signal-soft:#33260F;
  --good:#5BCB8C; --good-soft:#15301F; --bad:#F2796B; --bad-soft:#3A1915;
  --hl:#5B4A0E; --hl-ink:#FFF6D6; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1115; --surface:#151A20; --surface-2:#1C222A; --ink:#E6EAEE; --muted:#97A0AC; --line:#29303A;
  --accent:#45C4B9; --accent-ink:#06211F; --accent-soft:#163331;
  --signal:#F2A23C; --signal-soft:#33260F;
  --good:#5BCB8C; --good-soft:#15301F; --bad:#F2796B; --bad-soft:#3A1915;
  --hl:#5B4A0E; --hl-ink:#FFF6D6; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0}
.app{display:grid;grid-template-columns:244px minmax(0,1fr);gap:16px;height:100%}

/* sidebar */
.side{display:flex;flex-direction:column;gap:18px;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px}
.brand b{font-family:var(--f-display);font-size:21px;font-weight:700;letter-spacing:-.02em}
.brand svg{flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:500;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.wide{width:100%}
.nav{display:flex;flex-direction:column;gap:2px;min-height:0;overflow:auto}
.nav-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px;display:flex;justify-content:space-between;align-items:center}
.nav-label button{border:0;background:none;color:var(--muted);padding:2px 4px;border-radius:4px;font-size:16px;line-height:1}
.nav-label button:hover{color:var(--ink);background:var(--surface-2)}
.nav-item{display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:7px;padding:7px 10px;text-align:left;width:100%;color:var(--ink)}
.nav-item:hover{background:var(--surface-2)}
.nav-item.on{background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.nav-item .n{margin-left:auto;color:var(--muted);font-size:12px;font-family:var(--f-mono)}
.nav-item svg{flex:none;color:var(--muted)}
.usage{margin-top:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.usage .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.usage .plan{font-weight:600}
.meter{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
.usage small{color:var(--muted)}
.engine{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--signal);flex:none}
.dot.live{background:var(--good)}

/* main */
.main{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0;min-height:0;overflow:auto;position:relative;display:flex;flex-direction:column}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:20px 24px 14px;border-bottom:1px solid var(--line)}
.head h1{font-size:24px;margin-right:auto;min-width:0}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--bg);min-width:0;flex:0 1 260px}
.search input{border:0;background:none;outline:none;min-width:0;width:100%}
.content{padding:8px 24px 96px;flex:1}
table.files{width:100%;border-collapse:collapse}
.files th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.files td{padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.files tr.row{cursor:pointer}
.files tr.row:hover td{background:var(--bg)}
.files tr.sel td{background:var(--accent-soft)}
.files .name{display:flex;align-items:center;gap:10px;min-width:0}
.files .name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files .name small{color:var(--muted);display:block;font-size:12px}
.ftype{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);flex:none}
.col-num{text-align:right;white-space:nowrap}
.tablewrap{overflow-x:auto}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:500;white-space:nowrap}
.pill.done{background:var(--good-soft);color:var(--good)}
.pill.work{background:var(--signal-soft);color:var(--signal)}
.pill.err{background:var(--bad-soft);color:var(--bad)}
.pill.q{background:var(--surface-2);color:var(--muted)}
.pill.tag{background:var(--surface-2);color:var(--muted);font-weight:400}
.rec{width:7px;height:7px;border-radius:50%;background:currentColor;animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.kebab{border:0;background:none;border-radius:6px;padding:4px 6px;color:var(--muted)}
.kebab:hover{background:var(--surface-2);color:var(--ink)}
.empty{display:grid;place-items:center;text-align:center;padding:56px 16px;gap:14px;color:var(--muted)}
.empty h2{color:var(--ink);font-size:22px}
.drop-hint{position:absolute;inset:8px;border:2px dashed var(--accent);border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;font-family:var(--f-display);font-size:22px;color:var(--accent);z-index:30;pointer-events:none}

/* bulk bar */
.bulk{position:sticky;bottom:16px;margin:0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 10px 8px 16px;box-shadow:var(--shadow);width:max-content;max-width:calc(100% - 32px);z-index:5}
.bulk .btn{background:transparent;color:var(--bg);border-color:transparent}
.bulk .btn:hover{background:color-mix(in srgb,var(--bg) 14%,transparent)}
.bulk b{margin-right:6px;font-weight:600}

/* modal */
.scrim{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:50;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100% - 8px);overflow:auto;display:flex;flex-direction:column}
.modal.wide{width:min(760px,100%)}
.m-head{display:flex;align-items:center;gap:8px;padding:18px 20px 6px}
.m-head h2{font-size:20px;margin-right:auto}
.m-body{padding:10px 20px 4px;display:flex;flex-direction:column;gap:16px}
.m-foot{display:flex;justify-content:flex-end;gap:8px;padding:16px 20px 18px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--muted)}
select,input[type=text],textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
textarea{resize:vertical}
.dropzone{border:2px dashed var(--line);border-radius:12px;padding:26px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--bg);transition:border-color .15s,background .15s}
.dropzone.over{border-color:var(--accent);background:var(--accent-soft)}
.dropzone strong{font-family:var(--f-display);font-size:18px}
.dropzone small{color:var(--muted);font-size:12px}
.picked{display:flex;flex-direction:column;gap:6px}
.picked div{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 8px 6px 10px}
.picked span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.picked small{color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mode{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:4px}
.mode.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-soft)}
.mode b{font-weight:600;display:flex;align-items:center;gap:6px}
.mode small{color:var(--muted);font-size:12px}
details.more{border:1px solid var(--line);border-radius:10px}
details.more summary{padding:10px 12px;cursor:pointer;font-weight:500;list-style:none;display:flex;align-items:center;gap:8px}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{border-bottom:1px solid var(--line)}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;padding:12px;align-items:start}
.opt+.opt{border-top:1px solid var(--line)}
.opt input[type=checkbox]{margin-top:2px}
.opt b{font-weight:600}
.opt small{color:var(--muted);grid-column:2}
.opt select{grid-column:2;max-width:220px}
.note{font-size:12px;color:var(--muted)}
.callout{border-radius:10px;padding:10px 12px;font-size:13px;background:var(--signal-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--signal) 30%,transparent)}
.callout b{color:var(--signal)}
.plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.plancard{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.plancard.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.plancard h3{font-size:17px}
.plancard .price{font-family:var(--f-display);font-size:26px;font-weight:700}
.plancard ul{margin:0;padding-left:18px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.chk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 10px}

/* viewer */
.vhead{padding:16px 24px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.crumbs{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.crumbs button{border:0;background:none;color:var(--muted);padding:0}
.crumbs button:hover{color:var(--ink);text-decoration:underline}
.vtitle{font-family:var(--f-display);font-size:24px;font-weight:700;outline:none;border-radius:6px;padding:0 4px;margin:0 -4px;overflow-wrap:anywhere}
.vtitle:focus{background:var(--bg)}
.metas{display:flex;flex-wrap:wrap;gap:6px}
.vgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;flex:1;min-height:0}
.tcol{min-width:0;padding:14px 24px 24px;display:flex;flex-direction:column;gap:12px}
.tbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tbar .search{flex:1 1 220px}
.seg{display:grid;grid-template-columns:76px minmax(0,1fr);gap:4px 14px;padding:9px 10px;border-radius:8px;border-left:3px solid transparent}
.seg:hover{background:var(--bg)}
.seg.now{background:var(--accent-soft);border-left-color:var(--accent)}
.seg .ts{border:0;background:none;color:var(--muted);font-family:var(--f-mono);font-size:12px;padding:2px 0;text-align:left;align-self:start;margin-top:2px}
.seg .ts:hover{color:var(--accent)}
.seg .sp{font-weight:600;font-size:13px;grid-column:2;color:var(--spk,var(--ink))}
.seg .tx{grid-column:2;font-size:15.5px;line-height:1.65;max-width:72ch;cursor:text;outline:none;overflow-wrap:anywhere}
.tscript.noTs .seg{grid-template-columns:minmax(0,1fr)}
.tscript.noTs .ts{display:none}
.tscript.noTs .seg .sp,.tscript.noTs .seg .tx{grid-column:1}
.tscript.editing .tx{background:var(--bg);border-radius:6px;padding:2px 6px;margin:-2px -6px;box-shadow:inset 0 0 0 1px var(--line)}
mark{background:var(--hl);color:var(--hl-ink);border-radius:3px;padding:0 1px}
mark.cur{outline:2px solid var(--signal)}
.aside{border-left:1px solid var(--line);padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.panel h3{font-size:15px;display:flex;align-items:center;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}
input[type=checkbox].switch{appearance:none;width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
input[type=checkbox].switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(14px)}
.spk-row{display:flex;align-items:center;gap:8px}
.spk-row i{width:10px;height:10px;border-radius:50%;flex:none}
.spk-row input{padding:5px 8px}
.ai-out{font-size:13.5px;line-height:1.6;border-top:1px solid var(--line);padding-top:10px;overflow-wrap:anywhere}
.ai-out h4{margin:10px 0 4px;font-size:13px}
.ai-out p{margin:0 0 8px}
.ai-out ul{margin:0 0 8px;padding-left:18px}
.ai-out .tsl{border:0;background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 4px;font-family:var(--f-mono);font-size:12px}
.chat{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow:auto}
.bub{border-radius:10px;padding:8px 10px;font-size:13.5px;line-height:1.55;overflow-wrap:anywhere}
.bub.me{background:var(--surface-2);align-self:flex-end;max-width:90%}
.bub.ai{background:var(--bg);border:1px solid var(--line)}
.bub p{margin:0 0 6px}.bub p:last-child{margin:0}
.bub ul{margin:0;padding-left:18px}
.ask{display:flex;gap:6px}
.banner{margin:12px 24px 0;border-radius:10px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.banner.demo{background:var(--signal-soft);border:1px solid color-mix(in srgb,var(--signal) 30%,transparent)}
.banner.ex{background:var(--surface-2);border:1px solid var(--line)}
.banner b{color:var(--signal)}

/* player */
.player{position:sticky;bottom:0;z-index:4;background:var(--surface);border-top:1px solid var(--line);padding:10px 24px;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto auto;gap:12px;align-items:center}
.play{width:42px;height:42px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.play:hover{filter:brightness(1.08)}
.skip{border:0;background:none;color:var(--muted);font-family:var(--f-mono);font-size:12px;padding:4px}
.skip:hover{color:var(--ink)}
.wave{height:44px;width:100%;display:block;cursor:pointer;border-radius:6px}
.clock{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.clock b{color:var(--ink);font-weight:500}
.rate{width:auto;padding:4px 6px;font-size:12px}
.vmode{font-size:11px;color:var(--signal);font-family:var(--f-mono)}

/* menus & toasts */
.menu{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;min-width:170px;display:flex;flex-direction:column}
.menu button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:6px}
.menu button:hover{background:var(--surface-2)}
.menu button.del{color:var(--bad)}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:70;max-width:min(380px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;box-shadow:var(--shadow);font-size:13.5px;animation:rise .2s ease-out}
@keyframes rise{from{transform:translateY(8px);opacity:0}}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:rot .8s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
.menu-btn{display:none}

@media (max-width:1080px){
  .vgrid{grid-template-columns:minmax(0,1fr)}
  .aside{border-left:0;border-top:1px solid var(--line)}
}
@media (max-width:820px){
  body{overflow:auto;padding-block:12px}
  html,body{height:auto}
  .app{grid-template-columns:minmax(0,1fr);height:auto}
  .side{gap:10px}
  .side .nav,.side .usage{display:none}
  .side.open .nav,.side.open .usage{display:flex}
  .menu-btn{display:inline-flex;margin-left:auto}
  .brand{gap:10px}
  .main{overflow:visible;min-height:70vh}
  .head,.vhead{padding:16px}
  .content{padding:8px 12px 96px}
  .tcol{padding:12px}
  .banner{margin:12px 12px 0}
  .player{grid-template-columns:auto minmax(0,1fr) auto;padding:10px 12px;bottom:env(safe-area-inset-bottom,0px)}
  .player .skip,.player .rate{display:none}
  .player .clock{grid-column:1/-1;order:5}
  .hide-sm{display:none}
  .modes{grid-template-columns:minmax(0,1fr)}
  .plans{grid-template-columns:minmax(0,1fr)}
  .seg{grid-template-columns:minmax(0,1fr)}
  .seg .sp,.seg .tx{grid-column:1}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app">
  <aside class="side" id="side">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="8" fill="var(--accent)"/><g fill="var(--accent-ink)"><rect x="6" y="12" width="2.6" height="6" rx="1.3"/><rect x="10.6" y="8" width="2.6" height="14" rx="1.3"/><rect x="15.2" y="10.5" width="2.6" height="9" rx="1.3"/><rect x="19.8" y="6.5" width="2.6" height="17" rx="1.3"/></g></svg>
      <b>Murmur</b>

  rec.status = "processing"; refresh(rec);

/* Local engine. Files go to the server one at a time, so a batch never fills its disk with

    } catch (e) {

const aiErr = e => ({not_granted: "Claude wasn't allowed for this page, so AI tools are off for this visit.", rate_limited: "Too many requests right now. Try again in a minute.", prompt_too_large: "This transcript is too long to send in one go.", session_expired: "Your Claude session expired. Sign in again.", sampling_disabled: "Claude isn't available for this account.", refused: "Claude declined this request."}[e && e.code] || "That didn't work. Try again.");
const AI_PROMPTS = {
  summary: "Summarize this transcript for someone who missed it. Start with a two-sentence overview, then 3–6 bullet points with the most important points. Cite the timestamp in [mm:ss] form after each bullet. Plain text with '-' bullets, no tables.",
  actions: "List every decision and action item in this transcript. For each: '- **Owner** – task (due date if mentioned) [mm:ss]'. If no owner is named, write 'Unassigned'. If there are none, say so in one sentence.",
  chapters: "Split this transcript into 3–8 chapters. One line each: '- [mm:ss] Chapter title – one-sentence description'. Use the timestamp where the chapter starts."
};
async function runAI(rec, kind) {
  const out = $("#aiOut"); if (!out || vs.aiBusy) return;
  out.hidden = false; out.innerHTML = `<p class="note"><span class="spin"></span> Thinking…</p>`; vs.aiBusy = kind;
  $$("[data-ai]").forEach(b => b.disabled = true);
  try {
    const {text} = await cap.sample(`${AI_PROMPTS[kind]}\n\nTranscript of “${rec.name}”:\n\n${transcriptText(rec)}`, {onText: ({text}) => { const o = $("#aiOut"); if (o) o.innerHTML = md(text); }, cache: {gcTime: 3600e3}});
    rec.ai[kind] = text; rec.ai.last = kind; persist();
  } catch (e) { const o = $("#aiOut"); if (o) o.innerHTML = e.text ? md(e.text) + `<p class="note">${esc(aiErr(e))}</p>` : `<p class="note">${esc(aiErr(e))}</p>`; }
  vs.aiBusy = null; $$("[data-ai]").forEach(b => b.disabled = false);
}
function renderChat() { const c = $("#chat"); if (!c) return; c.innerHTML = vs.chat.map(m => `<div class="bub ${m.role === "user" ? "me" : "ai"}">${m.role === "user" ? esc(m.content) : md(m.content)}</div>`).join(""); c.scrollTop = c.scrollHeight; }
async function ask(rec, q) {
  vs.chat.push({role: "user", content: q}); vs.chat.push({role: "assistant", content: "…"}); renderChat();
  const rules = `You answer questions about one transcript. Use only what the transcript says; if it doesn't cover the question, say so. Keep answers short and cite timestamps as [mm:ss].\n\nTranscript of “${rec.name}”:\n\n${transcriptText(rec, 120000)}`;
  const turns = [{role: "user", content: rules}, ...vs.chat.slice(0, -1).slice(-12)];
  try {
    const {text} = await cap.sample(turns, {cache: false, onText: ({text}) => { vs.chat[vs.chat.length - 1].content = text; renderChat(); }});
    vs.chat[vs.chat.length - 1].content = text;
  } catch (e) { vs.chat[vs.chat.length - 1].content = (e.text ? e.text + "\n\n" : "") + aiErr(e); }
  renderChat();
}
async function translate(rec, lang) {
  const btn = $("#trGo"), note = $("#trNote"); btn.disabled = true;
  const texts = rec.segments.map(s => s.text), out = [], size = 60;
  try {
    for (let i = 0; i < texts.length; i += size) {
      const chunk = texts.slice(i, i + size);
      if (note) note.innerHTML = `<span class="spin"></span> Translating lines ${i + 1}–${Math.min(texts.length, i + size)} of ${texts.length}…`;
      const arr = await cap.sample.json(`Translate each string in this JSON array into ${lang}. Keep the meaning and tone, keep names unchanged, and return ONLY a JSON array of ${chunk.length} strings in the same order.\n\n${JSON.stringify(chunk)}`, {cache: {gcTime: 3600e3}});
      if (!Array.isArray(arr) || arr.length !== chunk.length) throw {code: "shape"};
      out.push(...arr.map(String));
    }
    rec.translations[lang] = out; persist(); vs.lang = lang; renderSegments(); renderViewerAside(); toast(`Translated to ${lang}.`);
  } catch (e) { if (note) note.textContent = e.code === "shape" ? "The translation came back in the wrong shape. Try again." : aiErr(e); btn.disabled = false; }
}

/* ---------- routing ---------- */
function go(view, fromHistory) {
  if (S.view.type === "file" && view.type !== "file" && player) { player.destroy(); player = null; }
  S.view = view; if (view.type === "list") { S.q = ""; } renderAll();
  $("#main").scrollTop = 0;
  if (fromHistory) return;
  // opening a transcript adds a history entry, so the browser's Back button returns to the list
  try {
    if (view.type === "file") history.pushState(null, "", "#" + view.id.replace(/[^\w.~-]/g, ""));
    else if (location.hash) history.replaceState(null, "", location.pathname + location.search);
  } catch (e) {}
}
addEventListener("popstate", () => {
  const f = findFile((location.hash || "").slice(1));
  if (f && f.status === "done") { if (S.view.type !== "file" || S.view.id !== f.id) go({type: "file", id: f.id}, true); }
  else if (S.view.type !== "list") go({type: "list", folder: "all"}, true);
});
function renderAll() { renderNav(); renderUsage(); if (S.view.type === "list") { if (!$("#listHead")) $("#main").innerHTML = ""; renderList(); } else renderViewer(); }
$("#newBtn").onclick = () => openUpload();
$("#menuBtn").onclick = () => { const s = $("#side"); s.classList.toggle("open"); $("#menuBtn").setAttribute("aria-expanded", s.classList.contains("open")); };
document.addEventListener("keydown", e => {
  if (S.view.type !== "file" || !player || $(".scrim")) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea" || tag === "select" || e.target.isContentEditable) return;
  if (e.key === " ") { e.preventDefault(); player.toggle(); }
  else if (e.key === "ArrowLeft") player.seek(player.time - 5);
  else if (e.key === "ArrowRight") player.seek(player.time + 5);
  else if (e.key === "Escape") go({type: "list", folder: player.rec.folderId || "all"});
});
addEventListener("resize", () => drawWave(true));
const reTheme = () => { waveColors = null; drawWave(true); };
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", reTheme);
new MutationObserver(reTheme).observe(document.documentElement, {attributes: true, attributeFilter: ["data-theme"]});

(async () => {
  if (!(await loadState())) { const ex = exampleFiles(); S.files = ex.files; S.folders = ex.folders; }
  const startId = (location.hash || "").slice(1);
  if (startId && findFile(startId)?.status === "done") S.view = {type: "file", id: startId};
  renderAll();
  await detectEngine();
  recoverJobs();
})();
})();
</script>
